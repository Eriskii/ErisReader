[package]
name = "erisreader-agents"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
description = "ErisReader's agents: annotations of a PDF as ErisHarness agents, on a ChatGPT or Claude login"

[dependencies]
erisharness = { git = "https://github.com/Eriskii/ErisHarness" }
anyhow = "1.0.104"
base64 = "0.23.1"
futures-util = "0.3.34"
libc = "0.2.189"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "=0.10.0"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time", "fs", "process"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[workspace]
